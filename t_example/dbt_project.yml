name: 't_example'
version: '1.0.0'

profile: 't_example'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  t_example:
    staging:
      schema: staging
      materialized: table
      tags: ['staging']

    intermediate: 
      materialized: ephemeral
      tags: ['intermediate']

    marts:
      schema: marts
      materialized: table
      tags: ['marts']

seeds:
  t_example:
    +schema: seeds
    tags: ['seeds']
